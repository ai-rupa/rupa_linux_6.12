# Define the system's default PCM device (playback/recording) based on the actual sound card name.
pcm.!default {
    type plug
    slave.pcm {
        type hw
        card "rk730es7210"
    }
}

# Define the system's default control device (used by amixer) based on the actual sound card name.
ctl.!default {
    type hw
    card "rk730es7210"
}
