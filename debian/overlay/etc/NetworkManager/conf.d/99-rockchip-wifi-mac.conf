# Keep the Wi-Fi MAC address coming from the driver.
#
# The Wi-Fi driver (swt6621s_wifi) takes the MAC from vendor storage
# (WIFI_MAC_ID, written by the factory tool), so wlan0's permanent address
# is e.g. 30:a6:12:1d:fd:ad.
#
# NetworkManager defaults to wifi.scan-rand-mac-address=yes, which replaces
# the interface MAC with a random address while scanning, so the interface
# shows e.g. 2e:c2:64:92:cb:c5 instead of the vendor MAC.
[device]
wifi.scan-rand-mac-address=no

# Also make sure connections always use the device (permanent) MAC instead of
# a per-connection random/stable one.
[connection]
wifi.cloned-mac-address=permanent
