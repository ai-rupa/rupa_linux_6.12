#
# Configuration for TDM Card, TX 8channel / RX 8channel
#
# Card: 100 for 48K Sampling rate
#

pcm.hw_primary {
    type hw
    card rockchiptdm
}

pcm_slave.tdmshare {
    pcm "hw_primary"
    channels 8
    rate 48000
    format S16_LE
    period_size 960
    buffer_size 3840
}

pcm.pcmC100D0p {
    type plug

    slave.pcm {
        type dshare
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmshare
        bindings.0 0
        bindings.1 1
    }
}

pcm.pcmC100D1p {
    type plug

    slave.pcm {
        type dshare
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmshare
        bindings.0 2
        bindings.1 3
    }
}

pcm.pcmC100D2p {
    type plug

    slave.pcm {
        type dshare
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmshare
        bindings.0 4
        bindings.1 5
    }
}

pcm.pcmC100D3p {
    type plug

    slave.pcm {
        type dshare
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmshare
        bindings.0 6
        bindings.1 7
    }
}

pcm_slave.tdmsnoop {
    pcm "hw_primary"
    channels 8
    rate 48000
    format S16_LE
    period_size 960
    buffer_size 3840
}

pcm.pcmC100D0c {
    type plug

    slave.pcm {
        type dsnoop
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmsnoop
        bindings.0 0
        bindings.1 1
    }
}

pcm.pcmC100D1c {
    type plug

    slave.pcm {
        type dsnoop
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmsnoop
        bindings.0 2
        bindings.1 3
    }
}

pcm.pcmC100D2c {
    type plug

    slave.pcm {
        type dsnoop
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmsnoop
        bindings.0 4
        bindings.1 5
    }
}

pcm.pcmC100D3c {
    type plug

    slave.pcm {
        type dsnoop
        tstamp_type monotonic
        ipc_key 6628
        slowptr 0

        slave tdmsnoop
        bindings.0 6
        bindings.1 7
    }
}

pcm.!default
{
    type asym
    playback.pcm "pcmC100D0p"
    capture.pcm "pcmC100D0c"
}