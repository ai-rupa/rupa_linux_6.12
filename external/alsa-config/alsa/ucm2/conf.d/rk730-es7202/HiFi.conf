Syntax 3

SectionVerb {
    EnableSequence [
        # Enable both outputs; no PipeWire on buildroot so both paths stay on,
        # DAPM handles amp GPIOs during playback.
        cset "name='OUT1 Switch' on"
        cset "name='OUT2 Switch' on"

        # SAI1 SDI0 only ; mic array is on card1 via PDM
        cset "name='SAI1 Receive PATH0 Source Select' From SDI0"
    ]
    DisableSequence [
    ]
}

SectionDevice."Headphones" {
    Comment "Headphones Output"

    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId}"
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }

    EnableSequence [
        cset "name='OUT1 Switch' on"
        cset "name='OUT2 Switch' off"
    ]

    DisableSequence [
    ]
}

SectionDevice."Speaker" {
    Comment "Speaker Output"

    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId}"
    }

    EnableSequence [
        cset "name='OUT2 Switch' on"
        cset "name='OUT1 Switch' off"
    ]

    DisableSequence [
    ]
}

SectionDevice."Headset" {
    Comment "Headset Microphone (RK730 MIC1 via SAI1 SDI0)"

    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId}"
        JackControl "Headphone Jack"
        JackHWMute "Mic"
    }

    EnableSequence [
        cset "name='Headset Mic Switch' on"
        cset "name='SAI1 Receive PATH0 Source Select' From SDI0"
    ]

    DisableSequence [
        cset "name='Headset Mic Switch' off"
    ]
}

SectionDevice."Mic" {
    Comment "Main Microphone (RK730 MIC2 via SAI1 SDI0)"

    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId}"
    }

    EnableSequence [
        cset "name='Headset Mic Switch' off"
        cset "name='Main Mic Switch' on"
        cset "name='SAI1 Receive PATH0 Source Select' From SDI0"
    ]

    DisableSequence [
        cset "name='Main Mic Switch' off"
    ]
}
